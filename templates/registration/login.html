{% extends 'base.html' %}

{% block title %}Masuk — AyokBelajar{% endblock %}

{% block content %}
<div class="mx-auto mt-8 max-w-md">
  <div class="rounded-2xl border border-teal-100/70 bg-white p-8 shadow-xl shadow-teal-100/30">
    <h1 class="text-2xl font-bold tracking-tight text-slate-900">Masuk</h1>
    <p class="mt-1 text-sm text-slate-500">Gunakan akun untuk mulai membuat kit belajar.</p>

    {% if form.non_field_errors %}
      <div class="mt-4 rounded-xl border border-rose-200 bg-rose-50 p-3 text-sm text-rose-600">
        {{ form.non_field_errors }}
      </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="id_username" class="mb-1.5 block text-sm font-medium text-slate-700">Username</label>
        <input type="text" name="username" id="id_username" autofocus required
               class="w-full rounded-xl border border-slate-200 p-2.5 focus:border-primary focus:outline-none focus:ring-2 focus:ring-teal-500/30">
      </div>
      <div>
        <label for="id_password" class="mb-1.5 block text-sm font-medium text-slate-700">Password</label>
        <input type="password" name="password" id="id_password" required
               class="w-full rounded-xl border border-slate-200 p-2.5 focus:border-primary focus:outline-none focus:ring-2 focus:ring-teal-500/30">
      </div>
      <button type="submit"
              class="w-full cursor-pointer rounded-xl bg-primary py-3 text-sm font-semibold text-white shadow-md transition-all duration-200 hover:bg-primary-hover active:scale-[0.98]">
        Masuk
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      Belum punya akun?
      <a href="{% url 'core:register' %}" class="font-semibold text-primary hover:text-primary-hover">Daftar gratis</a>
    </p>
  </div>
</div>
{% endblock %}
